[build-system]
requires = ["setuptools>=61.0", "numpy>=1.20"]
build-backend = "setuptools.build_meta"

[project]
name = "sandalwood"
version = "0.1.2"
authors = [
    { name="Shashikant Manikonda", email="manikonda@outlook.com" },
]
description = "A library for working with Multivariate Taylor Functions."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "numpy",
    "pandas",
    "tabulate",
]

[project.optional-dependencies]
accel = ["numba>=0.57"]
torch = ["torch"]
demos = [
    "jupyter",
    "matplotlib",
    "tqdm",
    "ipykernel",
    "jupytext",
    "psutil",
]
test = [
    "pytest",
    "pytest-cov",
    "matplotlib",
    "nbconvert",
    "ipykernel",
    "jupytext",
    "pandas",
    "torch",
    "ipython",
    "sympy",
    "jupyter",
    "psutil",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
    "myst_parser",
    "sympy",
    "matplotlib",
    "pandas",
    "torch",
    "ipython",
    "nbconvert"
]
dev = [
    "pytest",
    "pytest-cov",
    "matplotlib",
    "nbconvert",
    "ipykernel",
    "torch",
    "sphinx",
    "sphinx-rtd-theme",
    "myst_parser",
    "sympy",
    "pre-commit",
    "ruff",
    "jupytext",
    "pandas",
    "ipython",
    "mypy",
    "build",
    "twine",
    "jupyter",
]
   

[project.urls]
"Homepage" = "https://github.com/shashi-manikonda/sandalwood"
"Documentation" = "https://sandalwoodrary.readthedocs.io/en/latest/"
"Bug Tracker" = "https://github.com/shashi-manikonda/sandalwood/issues"

[project.scripts]
sandalwood-setup-cosy = "sandalwood.backends.cosy.install:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sandalwood.backends.cosy" = ["libcosy.*", "*.f", "cosy_config.env", "cosy.def"]

[tool.ruff]
line-length = 88
exclude = [
    "docs",
    "tests",
    "demos",
    "benchmark_MTF",
    "scripts",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
    "E501", # Line too long
    "F841", # Local variable assigned but unused
    "F401", # Imported but unused
    "E731", # Do not assign a lambda expression
    "E722", # Do not use bare except
    "F811", # Redefinition of unused name
    "E402", # Module level import not at top of file
]

[tool.ruff.format]
preview = true

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
exclude = ["^docs/.*", "^tests/.*", "^benchmark_MTF/.*", "^demos/.*"]
disable_error_code = ["var-annotated", "arg-type", "operator", "assignment", "index", "misc", "import-not-found", "import-untyped", "attr-defined", "no-redef", "return-value"]

[[tool.mypy.overrides]]
module = ["numpy.*", "pandas.*", "matplotlib.*", "scipy.*", "sympy.*", "tqdm.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "demo: marks tests as demo-based (slow, skipped by default)",
]
addopts = "-m \"not demo\""
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning"
]
