repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.10
    hooks:
      - id: ruff
        args: [ --fix ]
        exclude: ^docs/demos/
      - id: ruff-format
        exclude: ^docs/demos/
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        additional_dependencies: [numpy, pandas, types-setuptools, tabulate]
        exclude: ^docs/demos/|^tests/
  - repo: local
    hooks:
      - id: quick-demo-check
        name: Verify Demos (Quick)
        entry: python -m pytest -v -m demo tests/test_demos_quick.py
        language: system
        pass_filenames: false
        always_run: true
